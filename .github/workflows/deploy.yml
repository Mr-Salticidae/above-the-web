name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # 手动触发
  repository_dispatch:      # knowledge-base 更新后远程触发（type: kb-updated）
    types: [kb-updated]
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时兜底同步一次

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test               # 知识库检索放宽等纯逻辑单元测试，挂了就不出包
      - run: npm run build          # sync(克隆 knowledge-base) + astro build + pagefind
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 部署到香港轻量服务器（国内访问主入口，根路径 + 自定义域名）
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
          SITE_URL: https://tiaozhuxiansheng.com
      # 「AIGC 快讯」子站：同一份 src/data/news，另打一份以子域名根路径为 base 的产物，
      # 发给 GenJi 的学员。主站 /news/ 是原件，导航与站内入口一概不动；
      # 两份正文一致，搜索引擎只收原件（主站 canonical 自指，子站整站 noindex）。
      # nginx 与证书在服务器上一次性配好（platform/deploy/nginx-news.conf），CI 只同步产物。
      - name: 打「AIGC 快讯」子站独立包
        run: node scripts/build-news-site.mjs
      # 从 desk-pond 最新 Release 抓 Windows 安装包，随 dist 一起 rsync 到香港服务器，
      # 让主页能国内直连直接下载（不入 git、不进 Pages 产物——Pages 单文件 100MB 上限）。
      # 统一命名为稳定文件名，主页链接无需随版本改动；每次部署自动同步到最新版。
      - name: 拉取 desk-pond 最新 Release 安装包到 dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/desk-pond/download
          asset_url=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Mr-Salticidae/desk-pond/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*\.exe"' | head -1 | sed -E 's/.*"(https[^"]+)".*/\1/')
          echo "下载: $asset_url"
          test -n "$asset_url"
          curl -fL "$asset_url" -o dist/desk-pond/download/DeskPond-Windows.exe
          ls -la dist/desk-pond/download/
      # LiveLink（B 站直播弹幕助手）同理：安装包约 82MB，走服务器直连下载，
      # 稳定文件名 LiveLink-Setup.exe，/livelink/ 落地页链接不随版本变动。
      - name: 拉取 livelink 最新 Release 安装包到 dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/livelink/download
          asset_url=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Mr-Salticidae/livelink/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*\.exe"' | head -1 | sed -E 's/.*"(https[^"]+)".*/\1/')
          echo "下载: $asset_url"
          test -n "$asset_url"
          curl -fL "$asset_url" -o dist/livelink/download/LiveLink-Setup.exe
          ls -la dist/livelink/download/
      # 《镜像自我·人生预演》手机报告页镜像到 /mlr/：github.io 在大陆移动网络常不可达，
      # BW 展台扫码链路改走本域名（展台 config.json 的 reportBase 指向 /mlr/）。
      # 产物源头仍是 preview 仓库（主仓 deploy-preview.ps1 推送），这里只做镜像，
      # push / 手动触发 / 每 6 小时定时均会同步最新版。不进 Pages 产物（单文件 100MB 上限）。
      - name: 镜像 mirror-life-rehearsal 预览站到 dist/mlr
        run: |
          git clone --depth 1 https://github.com/Mr-Salticidae/mirror-life-rehearsal-preview.git /tmp/mlr-preview
          rm -rf /tmp/mlr-preview/.git
          mkdir -p dist/mlr
          cp -a /tmp/mlr-preview/. dist/mlr/

      # 《风眼》台风实况页镜像到 /typhoon-eye/：github.io 在大陆常不可达，防台工具
      # 恰恰要给大陆用户直连。实时数据由页面运行时从 jsDelivr 多镜像拉取，这里只
      # 镜像静态壳；push / 手动触发 / 每 6 小时定时均会同步最新版。
      - name: 镜像 typhoon-eye 到 dist/typhoon-eye
        run: |
          git clone --depth 1 https://github.com/Mr-Salticidae/typhoon-eye.git /tmp/typhoon-eye
          rm -rf /tmp/typhoon-eye/.git
          mkdir -p dist/typhoon-eye
          cp -a /tmp/typhoon-eye/. dist/typhoon-eye/

      - name: Rsync dist / dist-news 到香港服务器
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 43.128.2.172 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" dist/ root@43.128.2.172:/var/www/tiaozhuxiansheng/
          # 快讯子站是独立 root，跟主站目录互不干扰（各自的 --delete 都只清自己那份）
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" dist-news/ root@43.128.2.172:/var/www/atw-news/
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes root@43.128.2.172 'chown -R www-data:www-data /var/www/tiaozhuxiansheng /var/www/atw-news'
