name: 部署账号与任务服务

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:

# 同时只跑一次，避免两次推送把服务反复重启
concurrency:
  group: atw-platform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 跑流转回归（不过就不上线）
        run: cd platform/server && node --test test/*.test.js

      # DM 剧本内容通道的令牌：有 secret 就先送到服务器暂存（后面合并进 .env），
      # 没有就跳过——邀请码体系照常上线，只是内容接口返回「未配置」。
      # token 建议用 fine-grained PAT，只授 juben-dm-lab 的 Contents:Read。
      - name: 同步到香港服务器并重启
        env:
          HOST: ${{ secrets.HK_HOST }}
          JUBEN_REPO_TOKEN: ${{ secrets.JUBEN_REPO_TOKEN }}
        run: |
          test -n "$HOST" || { echo "::error::缺少仓库 secret HK_HOST（部署服务器地址），见 README「部署」一节"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # DM 剧本内容令牌：有 secret 就先暂存到服务器（下一步合并进 .env），
          # 没有就跳过——邀请码体系照常上线，内容接口返回「未配置」，不会崩。
          # token 建议用 fine-grained PAT，只授 juben-dm-lab 的 Contents: Read。
          if [ -n "$JUBEN_REPO_TOKEN" ]; then
            # 体检：令牌过期 / 被撤销 / 权限被收走时，站点只会静默变成「内容未配置」，
            # 没人会发现。这里让它在部署日志里显形（只告警，不拦住发布）。
            if curl -sf -o /dev/null \
                 -H "Authorization: Bearer $JUBEN_REPO_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 https://api.github.com/repos/Mr-Salticidae/juben-dm-lab; then
              echo "剧本内容令牌可用（private repo 可达）"
            else
              echo "::warning::JUBEN_REPO_TOKEN 读不到 juben-dm-lab：可能已过期或被撤销，档案库会静默降级成「未配置」。去 GitHub 重新签发并更新 secret，见 README「令牌轮换」。"
            fi
            printf 'ATW_JUBEN_TOKEN=%s\n' "$JUBEN_REPO_TOKEN" \
              | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes root@"$HOST" 'umask 077; cat > /tmp/atw-juben-token'
          else
            echo "未配置 JUBEN_REPO_TOKEN，剧本内容通道保持未配置"
          fi

          # 先把整份 platform（含 deploy 脚本）放到暂存目录，装没装过都用得上
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            platform/ \
            root@"$HOST":/tmp/atw-platform-src/

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes root@"$HOST" '
            set -e
            if [ ! -f /opt/atw-platform/server/.env ]; then
              echo "首次部署：跑安装脚本（建服务账号、目录、systemd、初始口令）"
              bash /tmp/atw-platform-src/deploy/setup-server.sh
            else
              # --delete 让删掉的文件线上也消失；但要排除运行时产物：
              #   .env  是服务器上生成的密钥，不在仓库里
              #   data/ 是本地开发遗留的数据目录（线上用 /var/lib/atw-platform）
              rsync -a --delete --exclude ".env" --exclude "data/" \
                /tmp/atw-platform-src/server/ /opt/atw-platform/server/
              # deploy 目录一并留一份：改 nginx 片段或重装时不用再去 /tmp 里翻
              rsync -a --delete /tmp/atw-platform-src/deploy/ /opt/atw-platform/deploy/
              chown -R atwplat:atwplat /opt/atw-platform
              chmod 600 /opt/atw-platform/server/.env
              systemctl restart atw-platform
            fi
            # 内容令牌合并进 .env 才算真生效：先删旧行再追加，反复部署不会堆重复项
            if [ -s /tmp/atw-juben-token ]; then
              grep -v "^ATW_JUBEN_TOKEN=" /opt/atw-platform/server/.env > /tmp/atw-env.merge || true
              cat /tmp/atw-juben-token >> /tmp/atw-env.merge
              cat /tmp/atw-env.merge > /opt/atw-platform/server/.env
              chmod 600 /opt/atw-platform/server/.env
              chown atwplat:atwplat /opt/atw-platform/server/.env
              rm -f /tmp/atw-env.merge /tmp/atw-juben-token
              systemctl restart atw-platform
              echo "已注入 DM 内容令牌并重启"
            fi
            sleep 1
            systemctl is-active atw-platform
            curl -fsS http://127.0.0.1:3200/api/meta > /dev/null && echo "API 自检通过"
          '
