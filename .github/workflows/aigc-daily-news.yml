# AIGC 每日快讯：云端定时搜集新闻并更新 /news/ 板块。
# 每天早晨自动运行（多个错峰 cron 互为重试），不依赖本地电脑开机。
# 需要仓库 secret：LONGCAT_API_KEY。
#
# 执行方式：两个脚本，不再用 claude-code-action 的 agentic loop。
#   1. news-fetch.mjs   —— 纯 Node 抓多个 RSS 源，产出候选列表（零 API 成本）
#   2. news-compose.mjs —— 单次结构化输出调用，选稿 + 写中文摘要
# 旧的 agentic 方案让模型自己 curl 抓 RSS，几十 KB 的 XML 在上下文里反复重放，
# 单次 70+ 回合、3 小时、$7（2026-07-25 实测 $6.89），把中转站余额烧穿。
# 现方案单次一轮请求（约 3.5K prompt + 0.9K completion）、1-2 分钟跑完。
# URL 由脚本从候选表回填，模型只输出候选 id，无从编造链接。
#
# 模型走 OpenAI 兼容协议（当前 LongCat-2.0）。换供应商只需改下面两个环境变量，
# 前提是对方支持 response_format.json_schema。
#
# 注：GITHUB_TOKEN 的 push 不会级联触发 deploy.yml 的 on:push，
#     所以本 workflow 在 push 后用 workflow_dispatch 主动触发一次部署。
name: AIGC Daily News

on:
  schedule:
    # GitHub schedule 在高峰时段（尤其整点/半点）实测延迟 3-4 小时甚至丢弃
    # （2026-07-04/05 的 01:30 cron 均 13:00+ 北京时间才触发）。
    # 对策：错峰分钟数 + 一天 4 枪互为重试；"当日期刊已存在"守卫保证幂等（空跑仅几秒）。
    - cron: '47 22 * * *' # 06:47 北京时间（前一天 UTC）
    - cron: '17 0 * * *'  # 08:17 北京时间
    - cron: '43 1 * * *'  # 09:43 北京时间
    - cron: '23 3 * * *'  # 11:23 北京时间（兜底）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只抓候选并把期刊打到日志，不写文件不提交'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: aigc-daily-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 当日期刊已存在（比如本地已手动更新过）则跳过，避免重复；dry-run 不受此限
      - name: 检查当日期刊是否已存在
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "src/data/news/$TODAY.json" ] && [ '${{ inputs.dry_run }}' != 'true' ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "当日期刊 $TODAY 已存在，跳过本次更新"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.exists == 'false'

      # 单个源抓取失败只告警不阻断——源随时可能改版或限流，凑够候选比源全更重要
      - name: 抓取新闻候选
        if: steps.check.outputs.exists == 'false'
        run: node scripts/news-fetch.mjs --date "${{ steps.check.outputs.today }}" --out "$RUNNER_TEMP/candidates.json"

      - name: 选稿并撰写当日快讯
        id: compose
        if: steps.check.outputs.exists == 'false'
        env:
          NEWS_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          NEWS_API_BASE: https://api.longcat.chat/openai/v1
          NEWS_MODEL: LongCat-2.0
        run: |
          set +e
          node scripts/news-compose.mjs \
            --in "$RUNNER_TEMP/candidates.json" \
            --date "${{ steps.check.outputs.today }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
          CODE=$?
          set -e
          # 退出码 3 = 合格新闻不足（当天确实没料），属正常情况，不算失败
          if [ $CODE -eq 3 ]; then
            echo "::notice::合格新闻不足，本次不出稿"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $CODE

      - name: 验证、提交并触发部署
        if: steps.check.outputs.exists == 'false' && steps.compose.outputs.skipped != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY='${{ steps.check.outputs.today }}'
          FILE="src/data/news/$TODAY.json"
          test -f "$FILE"
          # 条数下限校验（compose 已校验一次，这里兜底防脚本被改坏）
          node -e "const d=require('./$FILE'); if(!Array.isArray(d.items)||d.items.length<5){console.error('items 少于 5 条');process.exit(1)}"
          # 构建验证：JSON 损坏时 news.mjs 会静默跳过该期，因此必须确认当日页面真的生成了
          npm run build
          test -f "dist/news/$TODAY/index.html"
          # 期号 = news 目录下 JSON 总数（当日文件按日期排序必然是最后一个）
          N=$(ls src/data/news/*.json | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "news(快讯): 第 $N 期 $TODAY" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          # npm run build 里 stamp-assets 会原地改写 public/*/index.html（跟踪文件），
          # 不清掉的话 pull --rebase 会因脏工作区失败（2026-07-04 实测丢过一期提交）。
          # 只还原 public/，避免波及其他改动。
          git checkout -- public/
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN 的 push 不触发 deploy.yml 的 on:push，这里手动触发部署
          gh workflow run deploy.yml --ref main
