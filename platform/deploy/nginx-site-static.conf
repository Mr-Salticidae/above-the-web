# 主站 tiaozhuxiansheng.com 的静态产物配套 —— 加进主站现有的 server { } 块里（手动接入一次，
# 同 nginx-atw-platform.conf / nginx-music.conf 的惯例，CI 不代劳）。
# 背景见 docs/SITE_ARCHITECTURE_UPGRADE.md「部署侧一次性配置」。
#
# 落地：把下面几段粘进 server 块（与 /api/ 那几个 location 并列），nginx -t && systemctl reload nginx。
# 已有同名 location 的，合并里面的指令即可，不要重复声明。

# 1) 自定义 404：构建产物根目录有 404.html（蛛丝断了 + 站内搜索 + 最近更新）。
#    站点仍是纯静态多页，找不到就是真 404，不要兜回 /index.html。
error_page 404 /404.html;

# 2) Web App Manifest 的 MIME：旧版 nginx 的 mime.types 里没有 .webmanifest，
#    会按 application/octet-stream 下发，部分浏览器因此不认。
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
}

# 3) Astro 产物带内容哈希，文件名一变 URL 就变，可以放心长缓存
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 4) 订阅源、sitemap、llms.txt 随每次构建更新，短缓存即可；顺带让它们也走 gzip
location ~ ^/(rss\.xml|feed\.json|sitemap\.xml|llms\.txt|robots\.txt|notes/rss\.xml|news/rss\.xml)$ {
    add_header Cache-Control "public, max-age=600";
}
gzip_types text/css application/javascript application/json application/rss+xml application/xml
           application/feed+json application/manifest+json image/svg+xml text/plain;
