# 主站 tiaozhuxiansheng.com 的静态产物配套 —— 服务器上的落点是 /etc/nginx/snippets/atw-site-static.conf，
# 由主站 443 server 块里的 `include snippets/atw-site-static.conf;` 引入（紧跟 pb-docs.conf 那行）。
# 写入与回滚走手动工作流 .github/workflows/nginx-site.yml（mode=apply），背景见 docs/SITE_ARCHITECTURE_UPGRADE.md。
#
# 只放 server 上下文里的指令。刻意不写的：
#   · /_astro/ 长缓存 —— 主站 server 块里已有同名 location，重复声明 nginx -t 会报错
#   · 任何 add_header —— location 一旦写了 add_header，server 级的 Cache-Control $cache_ctrl 就不再继承

# 自定义 404：产物根目录的 404.html（蛛丝断了 + 站内搜索 + 最近更新）。
# 只作用于静态文件找不到的情况；/api/ 等反代默认不拦截上游错误，接口的 404 JSON 原样返回。
error_page 404 /404.html;

# Web App Manifest：nginx 1.24 的 mime.types 里没有 .webmanifest，否则会按 octet-stream 下发
location = /manifest.webmanifest {
    default_type application/manifest+json;
}

# 全局只开了 gzip on、没配类型（默认只压 text/html）。这里补上文本类资源。
gzip_types text/css application/javascript application/json text/xml application/xml
           application/rss+xml application/feed+json application/manifest+json image/svg+xml text/plain;
