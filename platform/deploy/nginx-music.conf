# 音乐静态目录：nginx 手动接入一次（同 nginx-atw-platform.conf 的操作惯例，CI 不代劳）。
# 把下面 location 块加进 tiaozhuxiansheng.com 的 server { } 内，然后：
#   nginx -t && systemctl reload nginx
# 音频由 scripts/upload-music.mjs 从本机 music-library/ 上传到 /var/www/atw-music/，不进 git。

location /music/audio/ {
    alias /var/www/atw-music/audio/;
    autoindex off;
    # mp3 流式播放：接受 range 请求（拖进度条必需），长缓存（文件名变更即换 URL）
    add_header Cache-Control "public, max-age=604800";
    add_header Accept-Ranges bytes;
}

location /music/covers/ {
    alias /var/www/atw-music/covers/;
    autoindex off;
    add_header Cache-Control "public, max-age=604800";
}
