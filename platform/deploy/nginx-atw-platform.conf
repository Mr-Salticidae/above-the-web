# 站点账号与任务流转服务的 nginx 片段 —— 加进 tiaozhuxiansheng.com 现有的 server { } 块里。
#
# 服务只提供 API，页面全部是主站的静态产物（/var/www/tiaozhuxiansheng/），
# 所以这里只反代 /api/。代码放 /opt/atw-platform/，完全避开主站部署时
# 对 /var/www/tiaozhuxiansheng/ 执行的 rsync --delete。

location /api/ {
    # 不带尾斜杠：保留 /api/ 前缀原样转给 Node，服务内部路由就是 /api/xxx
    proxy_pass http://127.0.0.1:3200;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 账号接口一律不缓存
    add_header Cache-Control "no-store" always;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}
