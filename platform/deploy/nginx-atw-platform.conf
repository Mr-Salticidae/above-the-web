# 站点账号与任务流转服务的 nginx 片段 —— 加进 tiaozhuxiansheng.com 现有的 server { } 块里。
#
# 服务只提供 API，页面全部是主站的静态产物（/var/www/tiaozhuxiansheng/），
# 所以这里只反代 /api/。代码放 /opt/atw-platform/，完全避开主站部署时
# 对 /var/www/tiaozhuxiansheng/ 执行的 rsync --delete。
#
# ⚠️ 顺序要点：/api/maieutic 早就归 api-proxy（127.0.0.1:3001）管。
# 下面这条精确匹配（location =）在 nginx 里优先级高于前缀匹配，必须保留，
# 否则 maieutic 的请求会被一并转给账号服务，返回 404。

location = /api/maieutic {
    proxy_pass http://127.0.0.1:3001/api/maieutic;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # 大模型响应慢，别用默认 60s
}

location /api/ {
    # 不带尾斜杠：保留 /api/ 前缀原样转给 Node，服务内部路由就是 /api/xxx
    proxy_pass http://127.0.0.1:3200;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 账号接口一律不缓存
    add_header Cache-Control "no-store" always;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}
