# 「AIGC 快讯」子站 news.tiaozhuxiansheng.com —— nginx 手动接入一次
# （同 nginx-music.conf / nginx-atw-platform.conf 的惯例，CI 不代劳）。
#
# 产物由 CI 打包并同步：deploy.yml 里 `node scripts/build-news-site.mjs` 出 dist-news/，
# rsync 到 /var/www/atw-news/。目录独立于主站 /var/www/tiaozhuxiansheng/，
# 两边的 rsync --delete 互不波及。
#
# 落地步骤（在服务器上，root）：
#   1) DNS 先加好 A 记录 news → 43.128.2.172 并确认已生效，否则 certbot 签不下来
#   2) cp 本文件到 /etc/nginx/sites-available/news.tiaozhuxiansheng.com
#      ln -sf /etc/nginx/sites-available/news.tiaozhuxiansheng.com /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3) certbot --nginx -d news.tiaozhuxiansheng.com --agree-tos -m <邮箱> --redirect
#      certbot 会自己回头往下面这个 server 块里补 443 与 80→443 跳转（同 pb / canvas 两个子域名）
#
# ⚠️ 主站 server 块的 server_name 带 `_` 且 listen 80 default_server：
#    只加 DNS 不加本文件，news 子域名会被主站兜住（HTTP 吐主站内容、HTTPS 撞证书不匹配）。
server {
    listen 80;
    listen [::]:80;
    server_name news.tiaozhuxiansheng.com;

    root /var/www/atw-news;
    index index.html;

    # 纯静态多页站，没有前端路由，找不到就是真 404——不要兜回 /index.html，
    # 那会让打错的期号悄悄显示成最新一期。
    location / {
        try_files $uri $uri/ =404;
    }

    # 构建产物带内容哈希，文件名变更即换 URL，可以长缓存
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
